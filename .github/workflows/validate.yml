name: "Validate"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  hassfest: # https://developers.home-assistant.io/blog/2020/04/16/hassfest
    name: "Hassfest Validation"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7"

      - name: "Run hassfest validation"
        uses: "home-assistant/actions/hassfest@master"

  hacs: # https://github.com/hacs/action
    name: "HACS Validation"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7"

      - name: "Run HACS validation"
        uses: "hacs/action@main"
        with:
          category: "integration"
          # The brands check requires this domain to be listed in
          # home-assistant/brands, which is a pull request against a different
          # repository and cannot be satisfied from here. Everything else HACS
          # checks is enforced. Drop this ignore once the brands PR lands.
          ignore: "brands"
