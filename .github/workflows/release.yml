name: Release

"on":
  release:
    types:
      - published
  # A failed upload leaves a published release with no asset, which is a
  # broken install for everyone. This makes that recoverable without deleting
  # and re-cutting the release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach the zip to"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Publish the HACS package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      # manifest.json ships a placeholder rather than a real version, so
      # nothing has to be bumped by hand before tagging. The placeholder is
      # deliberately not a plausible version -- substituting "0.0.0" would
      # silently no-op if someone ever set a real one.
      - name: Stamp the release version into the manifest
        run: |
          version="${{ github.event.release.tag_name || inputs.tag }}"
          version="${version,,}"
          version="${version#v}"
          manifest="custom_components/njtransit/manifest.json"

          grep -q '"version": "0000.0.0"' "$manifest" || {
            echo "::error::$manifest no longer carries the 0000.0.0 placeholder"
            exit 1
          }
          sed -i "s/0000\.0\.0/${version}/" "$manifest"
          python3 -c "
          import json, sys
          v = json.load(open('$manifest'))['version']
          print(f'manifest version is now {v}')
          sys.exit(0 if v == '${version}' else 1)
          "

      - name: Build the release zip
        run: |
          cd custom_components/njtransit
          # HACS extracts the archive straight into the integration directory,
          # so manifest.json has to sit at the zip root -- not under a
          # custom_components/njtransit/ prefix.
          zip -r njtransit.zip . -x '*__pycache__*' '*.pyc'

      - name: Verify the archive HACS will download
        run: |
          cd custom_components/njtransit
          # hacs.json promises this exact filename; a mismatch is a silent
          # install failure for every user rather than a build failure here.
          test "$(python3 -c "import json;print(json.load(open('../../hacs.json'))['filename'])")" = njtransit.zip

          unzip -l njtransit.zip
          for required in manifest.json __init__.py brand/icon.png translations/en.json; do
            unzip -l njtransit.zip | grep -q " $required\$" || {
              echo "::error::njtransit.zip is missing $required"
              exit 1
            }
          done
          if unzip -l njtransit.zip | grep -q __pycache__; then
            echo "::error::njtransit.zip contains bytecode"
            exit 1
          fi
          echo "archive looks right"

      # Uploaded with the gh CLI rather than a third-party action. The
      # previous action targets Node 20, gets force-run on Node 24, and failed
      # with "Request body length does not match content-length header" --
      # leaving 2026.8.0 published with no asset at all. gh ships on the
      # runner and has no such runtime mismatch.
      #
      # --clobber makes a retry idempotent, which matters because the only way
      # to recover a failed upload is to run this again against a release that
      # already exists.
      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release upload "$TAG" \
            custom_components/njtransit/njtransit.zip --clobber

      # The asset is the entire point of this workflow, and its absence is
      # invisible until a user tries to install. Confirm it landed.
      - name: Confirm the asset is attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          names=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "assets on $TAG: ${names:-<none>}"
          echo "$names" | grep -qx njtransit.zip || {
            echo "::error::njtransit.zip is not attached to $TAG"
            exit 1
          }
