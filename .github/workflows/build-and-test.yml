name: Build and Test
permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'
      - name: Install dependencies
        run: |
          python -m pip install uv
          uv venv
          uv pip install -r requirements.txt
      - name: Test with pytest
        run: uv run coverage run -m pytest
      - name: Enforce the coverage gate
        run: uv run coverage report
  ruff:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'
      - name: Install dependencies
        run: |
          python -m pip install uv
          uv venv
          uv pip install -r requirements.txt
      - name: Run ruff
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .
  mypy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'
      - name: Install dependencies
        run: |
          python -m pip install uv
          uv venv
          uv pip install -r requirements.txt
      - name: Run mypy
        run: uv run mypy .
  card:
    name: Lovelace card
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: 'frontend/.nvmrc'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      # HACS copies files and runs nothing, so the bundle is committed. That
      # only stays true if something checks: a card edited and not rebuilt
      # ships the old behaviour, and nothing else in this repository would
      # notice.
      - name: Rebuild and check the committed bundle still matches
        run: |
          npm run build
          git diff --exit-code -- ../custom_components/njtransit/frontend \
            || {
              echo "::error::the committed card is stale -- run \`npm run build\` in frontend/"
              exit 1
            }
