name-template: $RESOLVED_VERSION
tag-template: $RESOLVED_VERSION

categories:
  - title: "⚠️ Breaking changes"
    when:
      labels:
        - breaking
  - title: "🚀 New features"
    when:
      labels:
        - enhancement
  - title: "🐞 Bug fixes"
    when:
      labels:
        - bug
  - title: "📋 Other changes"
  - title: "🧩 Dependency updates"
    when:
      labels:
        - dependencies

# Labels drive the changelog sections above, and are applied from the
# Conventional Commits prefix this repo already requires rather than by hand.
# A PR titled `feat(sensor): ...` lands under "New features" without anyone
# remembering to label it.
#
# The autolabeler only writes labels when it runs as its own job on a
# pull_request event -- see the comment in workflows/release-drafter.yml.
autolabeler:
  - label: breaking
    title:
      - '/^[a-z]+(\(.+\))?!:/'
  - label: enhancement
    title:
      - '/^feat(\(.+\))?!?:/'
  - label: bug
    title:
      - '/^fix(\(.+\))?!?:/'
  - label: dependencies
    title:
      - '/^(build|chore)\(deps\)/'

# The version is not resolved here. Tags are CalVer -- year.month.patch --
# and this action can only bump a semver position on the previous tag, which
# rolls neither the year nor the month. `scripts/next_calver.py` works the
# number out in the workflow and passes it as the action's `version` input,
# which overrides anything resolved below.
#
# The resolver stays at patch so that, if the input were ever dropped, the
# draft would at least propose the same month's next patch rather than a
# label-driven minor bump: in CalVer the "minor" position is the month, and
# mapping `enhancement` onto it means a `feat:` merged in August proposes
# 2026.9.0, a September release in August. Breaking changes still get their
# own changelog section above; CalVer does not encode compatibility.
version-resolver:
  default: patch

template: |
  ## What's Changed

  $CHANGES

  ## Installation

  Install through HACS, or download `njtransit.zip` below and extract it into
  `config/custom_components/njtransit/`.
