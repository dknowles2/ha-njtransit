blueprint:
  name: NJ Transit favorite train Live Activity
  description: >
    Put your next favourite train on the iPhone Lock Screen and Dynamic Island
    as its departure approaches, keep it updated until it leaves, and stop
    when you dismiss it.


    Requires the **Favorite trains** option set on the commute, iOS 17.2+, and
    Home Assistant 2026.7 or later.


    The activity appears once the train is inside the lead time, refreshes when
    its status or track changes, and — if you are still following it when it
    leaves — switches to counting down to your arrival instead, showing how
    many stops are left and the next station. It clears when you get there.
    Updates reuse the same `tag`, so they are silent — no banner, no sound.


    The arrival half needs the commute's **Stops away** sensor, which is
    derived from the favourite sensor unless you say otherwise. Note it cannot
    tell whether you actually boarded: it follows the train you were waiting
    for, so if you watched it go, use **Dismiss**.


    It also shows how full the train is, once the board publishes consist data
    — which it only does for imminent departures, so expect this to appear part
    way through the countdown rather than at the start. Only *Filling up* and
    *Busy* are shown; a quiet train says nothing.


    The countdown is a `chronometer`, which ticks on the phone. That is why
    this does not push once a minute: only a real change to the train needs to
    be sent, and iOS rate-limits Live Activity updates.


    **Dismissing.** Live Activities cannot carry buttons, and swiping one
    away tells iOS but not Home Assistant — so the next refresh puts it back.
    A plain, silent notification carrying a **Dismiss** button is therefore
    sent alongside it. **Press and hold that notification, then tap Dismiss** —
    an action on an iOS notification only appears on a long press, and this one
    is delivered silently, so it never banners on its own. Dismissing ends the
    activity and stays quiet for the rest of the window, which is what stops a
    second favourite departing soon after the one you caught from counting down
    at you on the train. It resets when the commute window ends, or at 3am if
    you are not using a schedule.
  domain: automation
  source_url: https://github.com/dknowles2/ha-njtransit/blob/main/blueprints/automation/njtransit/favorite_live_activity.yaml
  homeassistant:
    min_version: "2026.7.0"
  input:
    favorite_sensor:
      name: Favorite train sensor
      description: >
        The `Next favorite` sensor for the commute. Set the commute's
        **Favorite trains** option first, or this never has anything to show.
      selector:
        entity:
          filter:
            - integration: njtransit
              domain: sensor
              device_class: timestamp
    progress_sensor:
      name: Progress sensor
      description: >
        Optional. The `Stops away` sensor for the same commute, which is what
        lets the activity carry on once you are aboard: it switches from
        counting down to the departure to counting down to the arrival.


        Left empty it is derived from the favourite sensor, which is right
        unless you have renamed one of them. Set it explicitly if you have.
      default: ""
      selector:
        entity:
          filter:
            - integration: njtransit
              domain: sensor
    notify_target:
      name: Phone
      description: >
        The iPhone to put the activity on. Pick its **notify entity** — the
        one the Home Assistant companion app creates, named after the device.


        What actually gets called is the older `notify.mobile_app_…` action
        for the same phone, derived from what you pick here. That indirection
        is not tidiness: a notify entity's `send_message` takes only a message
        and a title, with nowhere to put the `data` payload that carries the
        Live Activity. The entity is the thing worth *picking*, and the action
        is the only thing that can be *called*.


        Typing the action name directly still works, so an automation set up
        before this became a picker keeps running. Re-pick the phone when
        convenient — the stored text will look like an unknown entity in the
        UI until you do.
      selector:
        entity:
          filter:
            - integration: mobile_app
              domain: notify
    boarded_helper:
      name: Dismissed flag
      description: >
        A toggle helper this automation owns. Turned on when you tap
        **Dismiss**, turned off when the window resets. Create one under
        Settings → Devices & Services → Helpers. Leave empty to skip the
        button entirely -- the activity still appears and still clears after
        departure, it just cannot be dismissed early.
      default: ""
      selector:
        entity:
          filter:
            - domain: input_boolean
    presence_entity:
      name: Where you are
      description: >
        Optional. The person or device tracker to judge by. Leave empty and
        location is ignored entirely, which is how this behaved before.


        **It fails open.** If this entity has no location — phone off, GPS
        denied, not reported yet — the activity is shown anyway. A missing
        countdown for a train you were running for is a worse failure than an
        unnecessary one, and it would be invisible: you would simply never
        find out the notification was suppressed.
      default: ""
      selector:
        entity:
          filter:
            - domain: person
            - domain: device_tracker
    presence_zones:
      name: Only when you are in one of these
      description: >
        Optional, and does nothing without **Where you are**. The activity is
        shown only while you are inside one of these zones.


        Pick the places from which you would actually catch this train. For an
        outbound morning commute that is home, or a zone around the station
        big enough to cover getting there. For the return it is wherever you
        spend the day.


        This is what makes the activity stop being noise: on a day working
        from home you are not in the zone for the evening train, so nothing is
        sent. Once you are on the train you have left the morning zone, so the
        countdown to the *next* service out of your origin stops too.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: zone
    origin_radius:
      name: How far from the station still counts
      description: >
        Optional, and does nothing without **Where you are**. Used instead of
        zones when you have not set any.


        **In whatever unit your Home Assistant measures distance in** — miles
        on a US install, kilometres elsewhere. There is no unit shown on the
        box because a blueprint cannot know which one you are on, and printing
        the wrong one is worse than printing none. The derived default is
        computed the same way, so it is right either way.


        Leave it at 0 and it is worked out for you, from how far the origin
        station is from your Home Assistant home location: half that distance,
        floored at 2. For a station you walk to the floor does the work and
        covers home and the walk. For the far end of the commute the halving
        does — it takes in the whole city you might be anywhere in, while
        still excluding home, because half a distance can never reach it.


        That single rule is why there is no separate setting for the outbound
        and return legs. Set a number here only if it gets your geography
        wrong.
      default: 0
      selector:
        number:
          min: 0
          max: 50
          step: 0.5
          mode: box
    follow_any_train:
      name: Follow any train once your favourites have gone
      description: >
        Optional. When no favourite is left to catch, fall back to the next
        departure that actually serves your destination.


        For the evening you stayed late and your usual train went hours ago —
        the trains you would never normally take are exactly the ones you need
        then. Off by default, because without **Only when you are in one of
        these** set it means a countdown to *some* train all day. It only
        applies while you are in one of those zones, and inside the commute
        window if you have set one.
      default: false
      selector:
        boolean: {}
    commute_window:
      name: Commute window
      description: >
        Optional. A schedule covering the hours you travel — and, if you set
        one, **the activity is only sent while it is on**. Leave it empty and
        no time gating happens at all.


        This is the only thing that can tell a day off from a commute. Location
        cannot: on a working-from-home morning you are at home, which is
        exactly where you would be if you *were* about to catch the train, so
        no radius or zone can separate the two. A schedule that runs Tuesday to
        Thursday simply says nothing on a Friday.


        Its end also resets the dismissed flag. Without a schedule that happens
        at 3am instead.


        It gates the arrival countdown too, so set it wide enough to cover the
        journey — a window closing at 10:00 ends the countdown of a train
        arriving at 10:15. The alternative was letting the arrival half ignore
        the window, and that put a countdown on the Lock Screen of someone
        working from home, because the integration can see that a train left
        your station but not whether you were on it.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: schedule
    icon:
      name: Icon
      description: Material Design Icon slug shown on the activity.
      default: mdi:train
      selector:
        icon: {}
    dashboard_url:
      name: Open when tapped
      description: >
        Optional. Where tapping takes you, e.g. `/nj-trains/morning`.


        This rides on the **Dismiss** notification, not the Live Activity
        itself — putting a URL on the activity stopped it rendering at all. So
        it needs the dismissed-flag helper set to be reachable.


        **This is the one input that does not stand alone.** The blueprint
        cannot ship a dashboard, so pointing at one means whoever installs
        this has to build that dashboard themselves, with matching view paths,
        or the tap lands on a 404. Left empty — the default — tapping just
        opens Home Assistant wherever it was, and everything else works
        unchanged. Set it only once the dashboard exists.
      default: ""
      selector:
        text: {}
    lead_time:
      name: Start this many minutes before departure
      default: 30
      selector:
        number:
          min: 5
          max: 120
          step: 5
          unit_of_measurement: min
          mode: slider

mode: queued
max: 5
max_exceeded: silent

triggers:
  # A bare state trigger also fires on attribute changes, which is what
  # carries a new track or a slip to "12 min late".
  - trigger: state
    id: refresh
    entity_id: !input favorite_sensor
  # Crossing into or out of the lead window is the passage of time, which no
  # state change announces. Five minutes is enough because the chronometer
  # counts down on the phone between updates.
  - trigger: time_pattern
    id: refresh
    minutes: "/5"
  - trigger: event
    id: boarded
    event_type: mobile_app_notification_action
  - trigger: state
    id: reset
    entity_id: !input commute_window
    to: "off"
  # Without a schedule there is nothing to end the window, and a flag left on
  # would silence tomorrow as well.
  - trigger: time
    id: reset
    at: "03:00:00"

variables:
  sensor: !input favorite_sensor
  boarded: !input boarded_helper
  # What the picker returns is `notify.davids_iphone`; what has to be called is
  # `notify.mobile_app_davids_iphone`. Both are slugified from the same device
  # name by the same function at registration, so one is the other with a
  # prefix -- but only while the notify entity keeps its generated id. Rename
  # that entity and this stops resolving, because the action name was fixed
  # when the app registered and does not follow.
  #
  # The `mobile_app_` test is what lets an action name typed in before this
  # input became a picker keep working: it is already in the target form, so
  # it is passed through untouched rather than prefixed twice.
  notify_target: !input notify_target
  notify_action: >-
    {%- set name = notify_target | replace('notify.', '') -%}
    {{ 'notify.' ~ (name if name.startswith('mobile_app_')
                    else 'mobile_app_' ~ name) }}
  lead: !input lead_time
  icon: !input icon
  # Empty unless a dashboard was named. The notification payloads below are
  # built as templates rather than plain YAML so this key can be *absent*
  # rather than present-and-empty -- a blank `url` is not obviously harmless,
  # and this blueprint has to keep working for anyone who never builds the
  # dashboard.
  dashboard: !input dashboard_url
  progress: !input progress_sensor
  # Namespaced per commute, so two directions do not dismiss each other.
  action_id: >-
    {{ 'NJT_ONBOARD_' ~ (sensor | replace('sensor.', '') | upper) }}
  # The tags need namespacing for the same reason, and originally did not get
  # it. Two automations on one phone -- outbound and return -- shared a single
  # tag, so the one with nothing to show spent all evening clearing the tag the
  # other was actively using, wiping a live countdown off the Lock Screen every
  # five minutes. `clear_notification` on a tag you do not own is silent and
  # looks like nothing happened, which is what made it read as the activity
  # expiring on its own.
  tag: >-
    {{ 'njt_' ~ (sensor | replace('sensor.', '') | replace('_next_favorite', '')) }}
  dismiss_tag: "{{ tag ~ '_dismiss' }}"
  nothing: "{{ ['unknown', 'unavailable', 'none', ''] }}"
  presence: !input presence_entity
  zones: !input presence_zones
  windows: !input commute_window
  any_train: !input follow_any_train
  radius: !input origin_radius
  origin_lat: "{{ state_attr(sensor, 'origin_latitude') }}"
  origin_lon: "{{ state_attr(sensor, 'origin_longitude') }}"
  # How far home is from the station this commute leaves from. `distance` with
  # a bare coordinate pair measures from Home Assistant's own home location,
  # which is exactly the anchor wanted here.
  #
  # It answers in the instance's own distance unit, not always kilometres: on a
  # US install this is miles. Verified rather than assumed -- a station measured
  # at 0.99 km came back as 0.61. Nothing here converts, because every distance
  # in this gate comes from the same function and the derived radius is built
  # from that same answer, so the comparison is consistent whichever unit it
  # is. Only a *typed-in* number has to match the instance, which is what the
  # input description says.
  home_to_origin: >-
    {{ distance(origin_lat | float(0), origin_lon | float(0))
       if origin_lat is not none and origin_lon is not none else none }}
  # Half the distance home sits at, floored at 2.
  #
  # Halving is not arbitrary: it is the largest radius that cannot reach home,
  # so the far end of a commute silences itself on a day worked from home
  # without anyone choosing a number. At the near end the halving is irrelevant
  # and the floor does the work -- a station you walk to needs a radius that
  # still includes the house you walk from.
  effective_radius: >-
    {{ radius | float(0) if radius | float(0) > 0
       else ([2.0, home_to_origin | float(0) / 2] | max
             if home_to_origin is not none else 0) }}
  # Whether you are somewhere this train could still be caught from.
  #
  # Measured with `distance` against each zone's own radius rather than by
  # comparing the person's state to a zone name: a person entity reports
  # `home` for the home zone but the zone's *title* for every other one, and
  # a device tracker reports neither reliably. Coordinates are the only thing
  # both agree on.
  #
  # Fails open at every step. Not configured, no coordinates, or a zone that
  # cannot be measured all come out as "yes, show it" -- a suppressed
  # countdown is invisible, and the failure would look like the integration
  # having nothing to say rather than a location lookup going wrong.
  nearby: >-
    {%- if not presence -%}
    true
    {%- elif not zones and effective_radius | float(0) <= 0 -%}
    true
    {%- elif states(presence) in nothing or state_attr(presence, 'latitude') is none -%}
    true
    {%- elif not zones -%}
    {#- No zones, so fall back to plain distance from the station. `distance`
        returns null if the entity has no position, which is the same
        can-not-measure case the zone branch handles below. -#}
    {%- set away = distance(presence, origin_lat | float(0), origin_lon | float(0)) -%}
    {{ away is none or away <= effective_radius | float(0) }}
    {%- else -%}
    {%- set ns = namespace(near=false, measured=false) -%}
    {%- for z in zones -%}
    {%- set away = distance(presence, z) -%}
    {%- if away is not none -%}
    {%- set ns.measured = true -%}
    {%- if (away * 1000) <= (state_attr(z, 'radius') | float(100)) -%}
    {%- set ns.near = true -%}
    {%- endif -%}
    {%- endif -%}
    {%- endfor -%}
    {#- `not measured` is the fail-open case and it is not hypothetical: a
        renamed or deleted zone makes `distance` return null for every entry,
        and without this line that reads as "you are nowhere near any of them"
        and silences the commute permanently. Measured-and-outside and
        could-not-measure are different answers. -#}
    {{ ns.near or not ns.measured }}
    {%- endif -%}
  in_window: >-
    {{ not windows or windows | select('is_state', 'on') | list | count > 0 }}
  # The next train out, whoever is driving it. Only consulted once the
  # favourites are gone, and only somewhere you could board -- otherwise this
  # is a countdown to a service leaving a station you are nowhere near.
  #
  # The first train you could actually board, which is not the same as the
  # first train on the board: a cancelled service stays listed, and that is the
  # point of it being listed. Counting down to one on a Lock Screen is worse
  # than saying nothing, because a chronometer ticking toward a departure reads
  # as a train that is coming.
  #
  # Empty when every upcoming departure is cancelled -- during a line
  # suspension the honest Live Activity is no Live Activity, and the disruption
  # blueprint is what carries that news.
  fallback_entity: >-
    {%- set rows = [sensor | replace('_next_favorite', '_next_departure'),
                    sensor | replace('_next_favorite', '_departure_2'),
                    sensor | replace('_next_favorite', '_departure_3')] -%}
    {%- set pick = namespace(row='') -%}
    {%- for row in rows if not pick.row -%}
    {%- if states(row) not in nothing
           and state_attr(row, 'status') != 'cancelled' -%}
    {%- set pick.row = row -%}
    {%- endif -%}
    {%- endfor -%}
    {{ pick.row }}
  favorite_known: "{{ states(sensor) not in nothing }}"
  use_fallback: >-
    {{ any_train and not favorite_known and nearby | bool(false) and in_window
       and fallback_entity != '' }}
  source: "{{ fallback_entity if use_fallback else sensor }}"
  scheduled: "{{ states(source) }}"
  known: "{{ scheduled not in nothing }}"
  minutes_out: >-
    {{ ((as_timestamp(scheduled) - as_timestamp(now())) / 60) | round(0) | int
       if known else 9999 }}
  # Kept briefly past departure so the activity does not vanish the instant a
  # train you are running for slips off the board. An unset helper is "", and
  # is_state on "" is simply false, so leaving it empty behaves exactly as this
  # blueprint did before the input existed.
  # Note `in_window`. Without it the commute window only ever reset the
  # dismissed flag, so a schedule that deliberately excludes Friday still
  # counted down at someone working from home -- the input was named for a
  # behaviour it did not have.
  #
  # Deliberately not applied to `riding` below. A window ending at 10:00 while
  # you are aboard a train arriving at 10:30 must not take the arrival
  # countdown with it; the same reasoning as the location gate, which is also
  # about deciding whether to *board*, not whether you already have.
  waiting: >-
    {{ known and minutes_out <= (lead | int) and minutes_out > -2
       and not is_state(boarded, 'on') and nearby | bool(false)
       and in_window }}
  # Where the train is, once the departure board can no longer say. It drops a
  # train the moment it leaves, so from that point the stop list is the only
  # account of the journey -- and `sensor` has already moved on to whatever
  # favourite comes next, which is not the train you are sitting on.
  progress_entity: >-
    {{ progress if progress else (sensor | replace('_next_favorite',
                                                   '_stops_away')) }}
  eta: "{{ state_attr(progress_entity, 'eta_at_destination') }}"
  # `on_board` is the integration's own reading: origin behind the train,
  # destination still ahead. There is no way to know you actually boarded --
  # Home Assistant cannot see which platform you are on -- so this follows the
  # train you were waiting for and Dismiss remains the answer if you let it go.
  #
  # Deliberately not gated on location. Being aboard is itself the answer to
  # "could you catch this train", and the zones that make sense for waiting --
  # home, or the office -- are exactly the places you are *not* while riding.
  # Applying that gate here would kill the arrival countdown the moment it
  # became the useful half.
  #
  # `in_window` IS applied, and the reasoning that once excluded it was wrong.
  # It ran: a window ending at 10:00 must not take the arrival countdown of a
  # train arriving at 10:30 with it. True, but it rested on `on_board` meaning
  # "you are on this train" -- and it does not. It means the train has passed
  # your station, which happens every weekday whether or not you were on it.
  # So on a day off the favourite ran, left Short Hills, flipped `on_board`,
  # and put an arrival countdown on the Lock Screen of someone who had not
  # left the house. Observed twice.
  #
  # The cost is real but bounded and visible: if your window closes before
  # your train arrives, the last of the countdown goes with it. Widen the
  # window. That is a setting someone can find, and a silent notification on a
  # day off is not.
  riding: >-
    {{ state_attr(progress_entity, 'on_board') | default(false, true)
       and eta not in [none, 'unknown', 'unavailable', '']
       and not is_state(boarded, 'on')
       and in_window }}
  showing: "{{ waiting or riding }}"
  ride_train: "{{ state_attr(progress_entity, 'train_id') or '' }}"
  ride_stops: "{{ state_attr(progress_entity, 'stops_to_destination') }}"
  ride_next: "{{ state_attr(progress_entity, 'next_stop') or '' }}"
  ride_late: "{{ state_attr(progress_entity, 'minutes_late') | int(0) }}"
  train: "{{ state_attr(source, 'train_id') or '' }}"
  track: "{{ state_attr(source, 'track') }}"
  status: "{{ state_attr(source, 'status_text') or 'Scheduled' }}"
  destination: "{{ state_attr(source, 'destination') or '' }}"
  # How full the train is, when the board says. It only carries consist data
  # for imminent departures -- roughly a quarter of rows -- so this is empty
  # for most of the lead window and appears as departure nears, which is
  # exactly when it is worth knowing.
  #
  # `light` deliberately shows nothing: a train being empty is not something
  # you would act on, and a line of text that is always present stops being
  # read. Only the two levels worth reacting to say anything. Anything
  # unrecognized, including `unknown`, falls through to empty rather than
  # being reported as a crowding level.
  busy: >-
    {{ {'moderate': 'Filling up', 'heavy': 'Busy'}
       .get(state_attr(source, 'crowding'), '') }}
  # The status has to live in the title. `chronometer` replaces the message
  # line with the countdown, and replaces critical_text too, so the title is
  # the only text field that survives alongside a timer. An Apple Watch
  # renders the push as an ordinary notification and shows title + message,
  # which is why the status appeared there while the phone dropped it.
  #
  # Busyness goes last on purpose. The Dynamic Island truncates a long title,
  # and this is the ordering in which the pieces are worth losing: which train
  # and which track are why you are looking, the status changes whether you
  # leave, and how full it is only changes which car you walk toward.
  headline: >-
    Train {{ train }}{% if track %} · Track {{ track }}{% endif %}
    {{- ' · ' ~ status if status else '' }}
    {{- ' · ' ~ busy if busy else '' }}
  # Aboard, the three things worth a glance are which train, how much of the
  # journey is left, and whether it is running late. Track and crowding stop
  # mattering the moment the doors close.
  #
  # Zero stops means the destination is the next call, so it reads "Arriving"
  # rather than "0 stops" -- the number is only useful while there is one.
  ride_headline: >-
    Train {{ ride_train }}
    {{- ' · ' ~ ('Arriving' if ride_stops | int == 0 else
                 ride_stops ~ (' stop' if ride_stops | int == 1 else ' stops'))
        if ride_stops is not none else '' }}
    {{- ' · ' ~ ride_late ~ ' min late' if ride_late > 0 else '' }}
  activity_title: "{{ ride_headline if riding else headline }}"
  # The countdown target. Departure while waiting, arrival once aboard -- the
  # switch is the whole point, and it is one field.
  #
  # Both defaults are load-bearing. Variables are rendered on every trigger,
  # whatever branch the actions then take, so this has to survive there being
  # no train at all -- not merely the case where an activity is being shown.
  # `scheduled` is `unknown` for most of the day, and for the whole of a line
  # suspension, and `as_timestamp` raises on that rather than returning
  # nothing:
  #
  #   as_timestamp got invalid input 'unknown' ... but no default was specified
  #
  # The zero is never sent. It exists so the render succeeds; the branch that
  # would use it cannot run, because `showing` is false whenever `scheduled` is
  # unknown.
  activity_when: >-
    {{ (as_timestamp(eta, 0) if riding else as_timestamp(scheduled, 0)) | int }}
  activity_message: >-
    {%- if riding -%}
    {{ ('next ' ~ ride_next) if ride_next else 'Arriving' }}
    {%- else -%}
    {{ ('to ' ~ destination) if destination else status }}
    {{- ' · ' ~ busy if busy else '' }}
    {%- endif -%}

actions:
  - choose:
      - alias: You tapped Dismiss
        conditions:
          - condition: trigger
            id: boarded
          - condition: template
            value_template: >-
              {{ boarded and trigger.event.data.action == action_id }}
        sequence:
          # Templated rather than `!input`. The helper is optional, and an
          # empty `!input` lands in `target.entity_id` as `''`, which fails
          # config validation -- so leaving it empty, which the input's own
          # description invites, did not merely skip the Dismiss button: it
          # stopped the whole automation loading. A template is resolved at
          # run time instead, and this branch is unreachable without a helper
          # because the notification carrying the button is only sent when one
          # is set.
          - action: input_boolean.turn_on
            target:
              entity_id: "{{ boarded }}"
          - action: "{{ notify_action }}"
            data:
              message: clear_notification
              data:
                tag: "{{ tag }}"
          # The button's own notification has to go too, or it sits there
          # offering to dismiss something already gone.
          - action: "{{ notify_action }}"
            data:
              message: clear_notification
              data:
                tag: "{{ dismiss_tag }}"

      - alias: The window ended, so arm for next time
        conditions:
          - condition: trigger
            id: reset
          - condition: template
            value_template: "{{ boarded | length > 0 }}"
        sequence:
          # Templated for the same reason as the branch above, and guarded by
          # this branch's own `boarded | length > 0` condition.
          - action: input_boolean.turn_off
            target:
              entity_id: "{{ boarded }}"

      - alias: Show or refresh the activity
        conditions:
          - condition: trigger
            id: refresh
          - condition: template
            value_template: "{{ showing }}"
        sequence:
          - action: "{{ notify_action }}"
            data:
              title: "{{ activity_title }}"
              # Dropped on the phone, where `chronometer` takes this line, but
              # an Apple Watch renders the push as an ordinary notification and
              # shows it -- so it is worth carrying the busyness here too
              # rather than leaving the watch with only a truncated title.
              message: "{{ activity_message }}"
              data:
                tag: "{{ tag }}"
                live_update: true
                chronometer: true
                # An absolute Unix timestamp. `when_relative: true` would mean
                # "seconds from now" -- passing an epoch with it set makes the
                # phone count down from about 1.75 billion. Absolute is also
                # steadier: it cannot drift between this firing and the push
                # landing.
                when: "{{ activity_when }}"
                notification_icon: !input icon
                group: njtransit
                # Deliberately no `url` here. Adding one stopped the activity
                # rendering at all -- the payload was verified to reach the
                # notify service as a correct dict with `live_update` and
                # `chronometer` intact, so the extra key is the only thing that
                # changed. Live Activities are a narrow, undocumented surface
                # and are not the place to find out what else they tolerate.
                #
                # The tap-through lives on the companion notification below,
                # where `url` is ordinary and well understood.
          # The button has to ride on a separate, ordinary notification:
          # Live Activities cannot carry actions.
          #
          # Sent on every refresh rather than only the first. Trying to catch
          # the first meant a narrow "is this the start of the window" test,
          # and a refresh landing just inside it left no button at all. The
          # same `tag` makes each send replace the last rather than stack, and
          # `passive` keeps them from making a sound -- so repeating is free
          # and missing one is not.
          - if:
              - condition: template
                value_template: "{{ boarded | length > 0 }}"
            then:
              - action: "{{ notify_action }}"
                data:
                  title: "{{ activity_title }}"
                  # The gesture matters and is not guessable. An action on
                  # an iOS notification only appears on a long press, and
                  # this notification is `passive` -- it never banners, it
                  # goes straight to Notification Center, so there is no
                  # moment where the button is on screen by itself. Saying
                  # "tap" here sent people to the `url` below instead, which
                  # opens the dashboard and looks like the dismiss silently
                  # failing.
                  message: Hold this notification, then tap Dismiss
                  data: >-
                    {{ {
                         'tag': dismiss_tag,
                         'group': 'njtransit',
                         'notification_icon': icon,
                         'push': {'interruption-level': 'passive'},
                         'actions': [{'action': action_id, 'title': 'Dismiss'}],
                       } | combine({'url': dashboard} if dashboard else {}) }}

      # A refresh outside the window, or after boarding, ends the activity.
      # Clearing a tag that is not showing is a no-op, so this needs no memory
      # of whether one is currently live.
      #
      # Deliberately a branch rather than `default`. mobile_app_notification_action
      # fires for every notification action in the system, so with a default
      # branch someone else's button would fall through here and clear this
      # activity.
      - alias: Nothing to show, so end the activity
        conditions:
          - condition: trigger
            id: refresh
        sequence:
          - action: "{{ notify_action }}"
            data:
              message: clear_notification
              data:
                tag: "{{ tag }}"
          - action: "{{ notify_action }}"
            data:
              message: clear_notification
              data:
                tag: "{{ dismiss_tag }}"
