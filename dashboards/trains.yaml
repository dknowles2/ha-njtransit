              letter-spacing: 0.1em;
              text-transform: uppercase;
              color: var(--secondary-text-color);
            }
            h3 { margin: 0 0 6px; font-size: 1.15rem; font-weight: 600; }
            p { margin: 0 0 10px; line-height: 1.6; }
            p:last-child { margin-bottom: 0; }
            em { color: var(--secondary-text-color); }
            hr {
              border: none;
              border-top: 1px solid var(--divider-color);
              margin: 14px 0 12px;
            }
            /* Pills. The wrapper element picks the colour -- see the file
               header. `del` is a selector here, not a decoration, so the
               line through it is removed. */
            code {
              font-family: inherit;
              font-size: 0.8rem;
              font-weight: 700;
              letter-spacing: 0.015em;
              white-space: nowrap;
              padding: 4px 10px;
              border-radius: 999px;
              background: #00953b;
              color: #fff;
              border: 1px solid transparent;
            }
            strong code { background: var(--error-color); color: #fff; }
            del { text-decoration: none; }
            del code { background: var(--warning-color); color: #111; }
            em code {
              background: transparent;
              color: var(--secondary-text-color);
              border-color: var(--divider-color);
              font-weight: 600;
              font-style: normal;
            }
            blockquote {
              margin: 12px 0 0;
              padding: 9px 12px;
              border: none;
              border-left: 3px solid var(--error-color);
              border-radius: 0 8px 8px 0;
              background: color-mix(in srgb, var(--error-color) 10%, transparent);
              font-size: 0.9rem;
            }
            blockquote p { margin: 0; line-height: 1.5; }

    # The board itself. A real table, because aligned columns are what makes
    # three departures readable at a glance rather than three sentences.
    - type: markdown
      content: |-
        {%- set p = 'new_york_penn_station_to_short_hills_station' -%}
        {%- set nothing = ['unknown', 'unavailable', 'none', ''] -%}
        {%- set rows = ['sensor.' ~ p ~ '_next_departure',
                        'sensor.' ~ p ~ '_departure_2',
                        'sensor.' ~ p ~ '_departure_3'] -%}
        {%- set posting = rows | map('state_attr', 'track') | select('string') | list | count > 0 -%}
        {%- set ns = namespace(out=[]) -%}
        {%- for row in rows -%}
        {%- set t = states(row) -%}
        {%- if t not in nothing -%}
        {%- set mins = ((as_timestamp(t) - as_timestamp(now())) / 60) | round(0) | int -%}
        {%- set track = state_attr(row, 'track') -%}
        {%- set status = state_attr(row, 'status_text') -%}
        {%- set when = '**' ~ (as_timestamp(t) | timestamp_custom('%-I:%M')) ~ '**'
                       ~ ' *' ~ (mins ~ 'm' if mins > 0 else 'now') ~ '*' -%}
        {%- set train = (state_attr(row, 'train_id') | string)
                        ~ (' ⭐' if state_attr(row, 'favorite') else '') -%}
        {%- if track -%}
        {%- set cell = '`' ~ track ~ '`' -%}
        {%- elif posting and mins <= 6 -%}
        {%- set cell = '**`⚠️`**' -%}
        {%- else -%}
        {%- set cell = '*`—`*' -%}
        {%- endif -%}
        {%- if not status -%}
        {%- set tail = '' -%}
        {%- elif state_attr(row, 'status') == 'cancelled' -%}
        {%- set tail = '**`' ~ status ~ '`**' -%}
        {%- elif state_attr(row, 'delay_minutes') -%}
        {%- set tail = '~~`' ~ status ~ '`~~' -%}
        {%- else -%}
        {%- set tail = '*`' ~ status ~ '`*' -%}
        {%- endif -%}
        {%- set ns.out = ns.out + ['| ' ~ when ~ ' | ' ~ train ~ ' | ' ~ cell ~ ' | ' ~ tail ~ ' |'] -%}
        {%- endif -%}
        {%- endfor -%}
        {%- if ns.out -%}
        | Departs | Train | Trk | |
        |:--|:--|:--|:--|
        {{ ns.out | join('\n') }}
        {%- else -%}
        *Nothing scheduled.*
        {%- endif -%}
      card_mod:
        style:
          .: |
            ha-card { border-radius: 16px; }
          ha-markdown $: |
            :host { display: block; padding: 12px 16px 14px; }
            table {
              width: 100%;
              border-collapse: collapse;
              font-variant-numeric: tabular-nums;
            }
            th {
              padding: 0 4px 8px 0;
              border-bottom: 1px solid var(--divider-color);
              text-align: left;
              font-size: 0.65rem;
              font-weight: 700;
              letter-spacing: 0.12em;
              text-transform: uppercase;
              color: var(--secondary-text-color);
            }
            td {
              padding: 10px 4px 10px 0;
              border-bottom: 1px solid color-mix(in srgb, var(--divider-color) 45%, transparent);
              font-size: 0.98rem;
              white-space: nowrap;
            }
            tr:last-child td { border-bottom: none; }
            td em {
              font-style: normal;
              font-size: 0.8rem;
              color: var(--secondary-text-color);
              margin-left: 4px;
            }
            code {
              font-family: inherit;
              font-size: 0.75rem;
              font-weight: 700;
              white-space: nowrap;
              padding: 3px 9px;
              border-radius: 999px;
              background: #00953b;
              color: #fff;
              border: 1px solid transparent;
            }
            strong code { background: var(--error-color); color: #fff; }
            del { text-decoration: none; }
            del code { background: var(--warning-color); color: #111; }
            em code {
              background: transparent;
              color: var(--secondary-text-color);
              border-color: var(--divider-color);
              font-weight: 600;
              font-size: 0.75rem;
              margin-left: 0;
            }
            p { margin: 0; color: var(--secondary-text-color); }

    # Line-level notices. Hidden when there are none, and it leads with
    # whether any of them name a train you might actually be on -- three
    # paragraphs about the Gladstone Branch and one about your 6:31 look
    # identical until something says which is which.
    - type: markdown
      title: Service notices
      content: |-
        {%- set p = 'new_york_penn_station_to_short_hills_station' -%}
        {%- set live = 'sensor.' ~ p ~ '_service_alerts' -%}
        {%- set advisories = 'sensor.' ~ p ~ '_planned_advisories' -%}
        {%- set mine = state_attr(live, 'affects_my_trains') or [] -%}
        {%- if mine %}
        **`Names your train{{ 's' if mine | count > 1 else '' }} {{ mine | join(', ') }}`**
        {% endif -%}
        {%- for message in state_attr(live, 'messages') or [] %}
        🚨 {{ message }}
        {% endfor -%}
        {%- for message in state_attr(advisories, 'messages') or [] %}
        ℹ️ {{ message }}
        {% endfor -%}
      visibility:
      - condition: or
        conditions:
        - condition: numeric_state
          entity: sensor.new_york_penn_station_to_short_hills_station_service_alerts
          above: 0
        - condition: numeric_state
          entity: sensor.new_york_penn_station_to_short_hills_station_planned_advisories
          above: 0
      card_mod:
        style:
          .: |
            ha-card { border-radius: 16px; }
            .card-header {
              padding: 14px 16px 0;
              font-size: 0.7rem;
              font-weight: 700;
              letter-spacing: 0.12em;
              text-transform: uppercase;
              color: var(--secondary-text-color);
            }
          ha-markdown $: |
            :host { display: block; padding: 10px 16px 14px; }
            p { margin: 0 0 12px; line-height: 1.5; font-size: 0.9rem; }
            p:last-child { margin-bottom: 0; }
            code {
              font-family: inherit;
              font-size: 0.75rem;
              font-weight: 700;
              padding: 3px 9px;
              border-radius: 999px;
              background: var(--error-color);
              color: #fff;
            }
