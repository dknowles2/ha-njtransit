# A phone-shaped dashboard for the Live Activity to open.
#
# This is an *example*, not something the integration installs. Tapping a Live
# Activity can only open a dashboard that already exists, so the blueprint's
# "Open when tapped" input is empty by default and this file is what fills the
# gap -- copy it, change the two prefixes, and point the input at it.
#
# To install: Settings -> Dashboards -> Add dashboard -> New dashboard from
# scratch, give it the URL `nj-trains`, then open its raw configuration editor
# (three dots -> Raw configuration editor) and paste everything below.
#
# Then set the blueprint's "Open when tapped" to `/nj-trains/morning` on the
# outbound automation and `/nj-trains/evening` on the return one. The view
# paths are what those URLs refer to, so renaming a view breaks the link.
#
# ADAPTING THIS: every card builds its entity ids from a `p` set on its first
# line, so there is exactly one string to change per card, and the two views
# are identical apart from it. The prefix is the slugified commute name --
# `short_hills_station_to_new_york_penn_station` here. Check yours in
# Developer tools -> States by searching for `_next_departure`.
#
# Requires card-mod (available in HACS). Without it every card still renders,
# just as undifferentiated body text -- the countdown stops being readable at
# arm's length and the pills become backticked words, which is most of the
# point.
#
# HOW THE PILLS WORK. A markdown card cannot carry class names, so the pill
# colour is chosen by how the markdown nests around the backticks:
#
#     `Track 4`            plain code       line green, the neutral fact
#     **`Cancelled`**      strong > code    red, something is wrong
#     ~~`12 min late`~~    del > code       amber, degraded but running
#     *`Track due ~3 min`* em > code        outlined, merely informational
#
# The strikethrough is undone in CSS; it is a selector, not a decoration.
#
# The accent green is #00953b, which is what the departure board itself sends
# as the Morristown Line's colour. Other lines send their own -- the feed
# carries it per row -- but it also uses that field to mark cancellations, so
# it is not a dependable line identity and the integration does not expose it.
# Change the four occurrences below if your line is a different colour.
#
# The track line is the part worth understanding. New York Penn posts NJ
# Transit tracks a median of 8.8 minutes before departure with an
# interquartile range of 1.9 minutes (n=236). So a
# missing track inside 6 minutes is not "not yet", it is a deviation, and the
# card says so in red. It only says so when *other* trains on the board have
# their tracks, which is the same test the integration's `track_overdue` event
# uses: a station that posts nothing tells you nothing.

views:
- title: Morning
  path: morning
  type: sections
  max_columns: 1
  sections:
  - type: grid
    cards:

    - type: heading
      heading: Short Hills → New York Penn
      heading_style: title
      icon: mdi:weather-sunset-up

    # Leave now, and here is why. Nothing at all when the commute is fine.
    - type: markdown
      content: |-
        {%- set p = 'short_hills_station_to_new_york_penn_station' -%}
        {%- for reason in state_attr('binary_sensor.' ~ p ~ '_commute_disrupted', 'reasons') or [] %}
        **{{ reason }}**
        {% endfor -%}
      visibility:
      - condition: state
        entity: binary_sensor.short_hills_station_to_new_york_penn_station_commute_disrupted
        state: "on"
      card_mod:
        style:
          .: |
            ha-card {
              border: none;
              border-left: 4px solid var(--error-color);
              border-radius: 12px;
              background: color-mix(in srgb, var(--error-color) 13%, var(--card-background-color));
            }
          ha-markdown $: |
            :host { display: block; padding: 12px 14px; }
            p { margin: 0 0 6px; line-height: 1.45; font-size: 0.95rem; }
            p:last-child { margin-bottom: 0; }

    # The one train you are actually catching.
    - type: markdown
      content: |-
        {%- set p = 'short_hills_station_to_new_york_penn_station' -%}
        {%- set nothing = ['unknown', 'unavailable', 'none', ''] -%}
        {%- set fav = 'sensor.' ~ p ~ '_next_favorite' -%}
        {%- set prog = 'sensor.' ~ p ~ '_stops_away' -%}
        {%- set rows = ['sensor.' ~ p ~ '_next_departure',
                        'sensor.' ~ p ~ '_departure_2',
                        'sensor.' ~ p ~ '_departure_3'] -%}
        {#- Follow the favourite when it is on the board, otherwise the next
            train out. A dashboard that says "nothing to show" for the twenty
            hours a day you are not commuting is not worth opening. -#}
        {%- set tracking = states(fav) not in nothing -%}
        {%- set s = fav if tracking else rows[0] -%}
        {%- set t = states(s) -%}
        {%- if t in nothing -%}
        ### Nothing on the board

        No departures in the next couple of hours.
        {%- else -%}
        {%- set mins = ((as_timestamp(t) - as_timestamp(now())) / 60) | round(0) | int -%}
        {%- set track = state_attr(s, 'track') -%}
        {#- Other trains having tracks is what makes a missing one mean
            something. Same test the integration uses before it will call a
            track overdue. -#}
        {%- set posting = rows | map('state_attr', 'track') | select('string') | list | count > 0 -%}
        {%- set status = state_attr(s, 'status_text') -%}
        {%- set cancelled = state_attr(s, 'status') == 'cancelled' -%}
        {%- set delay = state_attr(s, 'delay_minutes') -%}
        {%- set crowding = state_attr(s, 'crowding') -%}
        # {% if mins < 0 %}Departed{% elif mins == 0 %}Now{% else %}{{ mins }} *min*{% endif %}

        ## {{ as_timestamp(t) | timestamp_custom('%-I:%M %p') }} · Train {{ state_attr(s, 'train_id') }}

        {# Pills, in the order a platform gets read: where, then how, then how
           full. Nesting picks the colour -- see the header. This comment opens
           without a dash on purpose: `{#-` would eat the blank line above it
           and weld the first pill onto the end of the heading. -#}
        {% if track %}`Track {{ track }}`
        {%- elif not posting %}*`Track not posted`*
        {%- elif mins <= 6 %}**`⚠️ Track overdue`**
        {%- elif mins <= 10 %}*`Track due any minute`*
        {%- elif mins <= 25 %}*`Track due in ~{{ mins - 9 }} min`*
        {%- else %}*`Track not posted yet`*{% endif -%}
        {%- if status %}
        {%- if cancelled %} **`{{ status }}`**
        {%- elif delay %} ~~`{{ status }}`~~
        {%- else %} *`{{ status }}`*{% endif -%}
        {%- endif -%}
        {%- if crowding == 'heavy' %} ~~`Busy`~~
        {%- elif crowding == 'moderate' %} *`Filling up`*{% endif %}

        {#- Where to stand, and only when standing somewhere else would help.
            "Front light · Middle light · Back light" is three facts and no
            decision. -#}
        {%- set rank = {'light': 0, 'moderate': 1, 'heavy': 2} -%}
        {%- set ns = namespace(best=none, low=9, high=-1) -%}
        {%- for car in state_attr(s, 'cars') or [] if car.crowding in rank and car.position -%}
        {%- set r = rank[car.crowding] -%}
        {%- if r < ns.low %}{% set ns.low = r %}{% set ns.best = car.position %}{% endif -%}
        {%- if r > ns.high %}{% set ns.high = r %}{% endif -%}
        {%- endfor -%}
        {%- if ns.best and ns.high > ns.low %}

        *{{ ns.best | title }} cars are emptier*
        {%- endif -%}

        {#- Stops away only follows the favourite, so it is only ever news
            when we are following one. -#}
        {%- if tracking -%}
        {%- set away = states(prog) -%}
        {%- if away not in nothing %}

        ---

        {% if away | int == 0 %}Arriving now{% else %}**{{ away }}** stops away{% endif %}
        {%- if state_attr(prog, 'next_stop') %} · next {{ state_attr(prog, 'next_stop') }}{% endif %}
        {%- endif -%}
        {%- endif -%}

        {#- Alerts that name this train by number, as opposed to the line-level
            notices further down. -#}
        {%- for message in state_attr(s, 'alerts') or [] %}

        > {{ message }}
        {%- endfor -%}

        {%- if not tracking %}
        {%- set favorites = state_attr(fav, 'favorites') or [] %}

        {% if favorites %}*Waiting for {{ favorites | join(', ') }} — not on the board yet.*
        {%- else %}*No favourite set. Pick one in this commute's options.*{% endif -%}
        {%- endif -%}
        {%- endif -%}
      card_mod:
        style:
          .: |
            ha-card {
              border: none;
              border-top: 3px solid #00953b;
              border-radius: 16px;
              overflow: hidden;
              background:
                linear-gradient(168deg,
                  color-mix(in srgb, #00953b 10%, var(--card-background-color)) 0%,
                  var(--card-background-color) 62%);
            }
          ha-markdown $: |
            :host { display: block; padding: 16px 16px 18px; }
            h1 {
              margin: 0 0 2px;
              font-size: 3.5rem;
              font-weight: 800;
              line-height: 0.95;
              letter-spacing: -0.035em;
              font-variant-numeric: tabular-nums;
              color: var(--primary-text-color);
            }
            /* The unit, kept small so the number carries the card. */
            h1 em {
              font-size: 0.28em;
              font-style: normal;
              font-weight: 600;
              letter-spacing: 0.1em;
              text-transform: uppercase;
              color: var(--secondary-text-color);
              margin-left: 0.3em;
              vertical-align: 0.6em;
            }
            h2 {
              margin: 0 0 14px;
              font-size: 0.78rem;
              font-weight: 600;
              letter-spacing: 0.1em;
              text-transform: uppercase;
              color: var(--secondary-text-color);
            }
            h3 { margin: 0 0 6px; font-size: 1.15rem; font-weight: 600; }
            p { margin: 0 0 10px; line-height: 1.6; }
            p:last-child { margin-bottom: 0; }
            em { color: var(--secondary-text-color); }
            hr {
              border: none;
              border-top: 1px solid var(--divider-color);
              margin: 14px 0 12px;
            }
            /* Pills. The wrapper element picks the colour -- see the file
               header. `del` is a selector here, not a decoration, so the
               line through it is removed. */
            code {
              font-family: inherit;
              font-size: 0.8rem;
              font-weight: 700;
              letter-spacing: 0.015em;
              white-space: nowrap;
              padding: 4px 10px;
              border-radius: 999px;
              background: #00953b;
              color: #fff;
              border: 1px solid transparent;
            }
            strong code { background: var(--error-color); color: #fff; }
            del { text-decoration: none; }
            del code { background: var(--warning-color); color: #111; }
            em code {
              background: transparent;
              color: var(--secondary-text-color);
              border-color: var(--divider-color);
              font-weight: 600;
              font-style: normal;
            }
            blockquote {
              margin: 12px 0 0;
              padding: 9px 12px;
              border: none;
              border-left: 3px solid var(--error-color);
              border-radius: 0 8px 8px 0;
              background: color-mix(in srgb, var(--error-color) 10%, transparent);
              font-size: 0.9rem;
            }
            blockquote p { margin: 0; line-height: 1.5; }

    # The board itself. A real table, because aligned columns are what makes
    # three departures readable at a glance rather than three sentences.
    - type: markdown
      content: |-
        {%- set p = 'short_hills_station_to_new_york_penn_station' -%}
        {%- set nothing = ['unknown', 'unavailable', 'none', ''] -%}
        {%- set rows = ['sensor.' ~ p ~ '_next_departure',
                        'sensor.' ~ p ~ '_departure_2',
                        'sensor.' ~ p ~ '_departure_3'] -%}
        {%- set posting = rows | map('state_attr', 'track') | select('string') | list | count > 0 -%}
        {%- set ns = namespace(out=[]) -%}
        {%- for row in rows -%}
        {%- set t = states(row) -%}
        {%- if t not in nothing -%}
        {%- set mins = ((as_timestamp(t) - as_timestamp(now())) / 60) | round(0) | int -%}
        {%- set track = state_attr(row, 'track') -%}
        {%- set status = state_attr(row, 'status_text') -%}
        {%- set when = '**' ~ (as_timestamp(t) | timestamp_custom('%-I:%M')) ~ '**'
                       ~ ' *' ~ (mins ~ 'm' if mins > 0 else 'now') ~ '*' -%}
        {%- set train = (state_attr(row, 'train_id') | string)
                        ~ (' ⭐' if state_attr(row, 'favorite') else '') -%}
        {%- if track -%}
        {%- set cell = '`' ~ track ~ '`' -%}
        {%- elif posting and mins <= 6 -%}
        {%- set cell = '**`⚠️`**' -%}
        {%- else -%}
        {%- set cell = '*`—`*' -%}
        {%- endif -%}
        {%- if not status -%}
        {%- set tail = '' -%}
        {%- elif state_attr(row, 'status') == 'cancelled' -%}
        {%- set tail = '**`' ~ status ~ '`**' -%}
        {%- elif state_attr(row, 'delay_minutes') -%}
        {%- set tail = '~~`' ~ status ~ '`~~' -%}
        {%- else -%}
        {%- set tail = '*`' ~ status ~ '`*' -%}
        {%- endif -%}
        {%- set ns.out = ns.out + ['| ' ~ when ~ ' | ' ~ train ~ ' | ' ~ cell ~ ' | ' ~ tail ~ ' |'] -%}
        {%- endif -%}
        {%- endfor -%}
        {%- if ns.out -%}
        | Departs | Train | Trk | |
        |:--|:--|:--|:--|
        {{ ns.out | join('\n') }}
        {%- else -%}
        *Nothing scheduled.*
        {%- endif -%}
      card_mod:
        style:
          .: |
            ha-card { border-radius: 16px; }
          ha-markdown $: |
            :host { display: block; padding: 12px 16px 14px; }
            table {
              width: 100%;
              border-collapse: collapse;
              font-variant-numeric: tabular-nums;
            }
            th {
              padding: 0 4px 8px 0;
              border-bottom: 1px solid var(--divider-color);
              text-align: left;
              font-size: 0.65rem;
              font-weight: 700;
              letter-spacing: 0.12em;
              text-transform: uppercase;
              color: var(--secondary-text-color);
            }
            td {
              padding: 10px 4px 10px 0;
              border-bottom: 1px solid color-mix(in srgb, var(--divider-color) 45%, transparent);
              font-size: 0.98rem;
              white-space: nowrap;
            }
            tr:last-child td { border-bottom: none; }
            td em {
              font-style: normal;
              font-size: 0.8rem;
              color: var(--secondary-text-color);
              margin-left: 4px;
            }
            code {
              font-family: inherit;
              font-size: 0.75rem;
              font-weight: 700;
              white-space: nowrap;
              padding: 3px 9px;
              border-radius: 999px;
              background: #00953b;
              color: #fff;
              border: 1px solid transparent;
            }
            strong code { background: var(--error-color); color: #fff; }
            del { text-decoration: none; }
            del code { background: var(--warning-color); color: #111; }
            em code {
              background: transparent;
              color: var(--secondary-text-color);
              border-color: var(--divider-color);
              font-weight: 600;
              font-size: 0.75rem;
              margin-left: 0;
            }
            p { margin: 0; color: var(--secondary-text-color); }

    # Line-level notices. Hidden when there are none, and it leads with
    # whether any of them name a train you might actually be on -- three
    # paragraphs about the Gladstone Branch and one about your 6:31 look
    # identical until something says which is which.
    - type: markdown
      title: Service notices
      content: |-
        {%- set p = 'short_hills_station_to_new_york_penn_station' -%}
        {%- set live = 'sensor.' ~ p ~ '_service_alerts' -%}
        {%- set advisories = 'sensor.' ~ p ~ '_planned_advisories' -%}
        {%- set mine = state_attr(live, 'affects_my_trains') or [] -%}
        {%- if mine %}
        **`Names your train{{ 's' if mine | count > 1 else '' }} {{ mine | join(', ') }}`**
        {% endif -%}
        {%- for message in state_attr(live, 'messages') or [] %}
        🚨 {{ message }}
        {% endfor -%}
        {%- for message in state_attr(advisories, 'messages') or [] %}
        ℹ️ {{ message }}
        {% endfor -%}
      visibility:
      - condition: or
        conditions:
        - condition: numeric_state
          entity: sensor.short_hills_station_to_new_york_penn_station_service_alerts
          above: 0
        - condition: numeric_state
          entity: sensor.short_hills_station_to_new_york_penn_station_planned_advisories
          above: 0
      card_mod:
        style:
          .: |
            ha-card { border-radius: 16px; }
            .card-header {
              padding: 14px 16px 0;
              font-size: 0.7rem;
              font-weight: 700;
              letter-spacing: 0.12em;
              text-transform: uppercase;
              color: var(--secondary-text-color);
            }
          ha-markdown $: |
            :host { display: block; padding: 10px 16px 14px; }
            p { margin: 0 0 12px; line-height: 1.5; font-size: 0.9rem; }
            p:last-child { margin-bottom: 0; }
            code {
              font-family: inherit;
              font-size: 0.75rem;
              font-weight: 700;
              padding: 3px 9px;
              border-radius: 999px;
              background: var(--error-color);
              color: #fff;
            }

